steps:
  # :slim, not the full cloud-sdk image. This build's only job is to kick the
  # monorepo trigger — a command that takes seconds — but it was measured at
  # 69-88s, nearly all of it pulling the multi-GB fat image. Same gcloud CLI.
  # Covered by app.gyatso.me tests/test_relay_triggers.sh.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - builds
      - triggers
      - run
      - $_DEPLOY_TRIGGER
      - --branch=main
      - --project=$_DEPLOY_PROJECT

options:
  logging: CLOUD_LOGGING_ONLY
